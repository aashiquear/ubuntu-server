<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files · Ubuntu Web Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
    .crumbs { font-size: 14px; color: var(--muted); word-break: break-all; }
    .crumbs a { color: var(--text); }
    .dropzone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      transition: border-color 0.15s ease, background 0.15s ease; min-height: 300px;
    }
    .dropzone.drag { border-color: var(--accent); background: rgba(233,84,32,0.06); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    tr.row:hover { background: var(--bg-elev2); }
    td.name { cursor: pointer; }
    td.name .ic { margin-right: 8px; }
    td.actions { text-align: right; white-space: nowrap; }
    td.actions a, td.actions button { margin-left: 8px; }
    .muted { color: var(--muted); }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
    .link-btn.danger { color: var(--err); }
    #uploads { margin-top: 12px; }
    .up-item { font-size: 13px; color: var(--muted); padding: 4px 0; }
    .up-bar { height: 6px; background: var(--bg-elev2); border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .up-bar > span { display:block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s ease; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">📁</span> File Browser</div>
    <div class="right">
      <span class="user" id="whoami">…</span>
      <a class="btn ghost small" href="/" target="_self">Dashboard</a>
    </div>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="crumbs" id="crumbs">~</div>
      <span style="flex:1"></span>
      <button class="btn secondary small" id="btn-refresh">↻ Refresh</button>
      <button class="btn secondary small" id="btn-mkdir">＋ New folder</button>
      <label class="btn small" style="cursor:pointer">
        ⬆ Upload
        <input type="file" id="file-input" multiple style="display:none" />
      </label>
    </div>

    <div class="card dropzone" id="dropzone">
      <table>
        <thead>
          <tr><th style="width:55%">Name</th><th>Size</th><th>Modified</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint">Tip: drag files from your computer anywhere onto the list to upload them here. Click a file to download it.</p>
    <div id="uploads"></div>
  </div>

  <script src="/js/files.js"></script>
</body>
</html>
