<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Desktop · Ubuntu Web Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { overflow: hidden; }
    .feature-page .body { background: #101317; display: grid; place-items: center; }
    #display { width: 100%; height: 100%; overflow: hidden; }
    #display canvas { display: block; margin: 0 auto; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--muted); text-align: center; pointer-events: none;
    }
    .overlay .box { background: rgba(0,0,0,0.5); padding: 18px 24px; border-radius: 10px; pointer-events: auto; }
    .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-right:6px; vertical-align: middle; }
    .status.connected .dot { background: var(--ok); }
    .status.closed .dot { background: var(--err); }
  </style>
</head>
<body>
  <div class="feature-page">
    <div class="topbar">
      <div class="brand"><span class="logo">🖼️</span> Remote Desktop (XRDP)</div>
      <div class="right">
        <span class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
        <button class="btn ghost small" id="btn-reconnect">Reconnect</button>
        <a class="btn ghost small" href="/" target="_self">Dashboard</a>
      </div>
    </div>
    <div class="body">
      <div id="display"></div>
      <div class="overlay" id="overlay"><div class="box" id="overlay-text">Starting remote desktop…</div></div>
    </div>
  </div>

  <script src="/vendor/guacamole-common.min.js"></script>
  <script src="/js/desktop.js"></script>
</body>
</html>
