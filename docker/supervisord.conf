[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---- System message bus (needed by XFCE/XRDP) ----
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.log

; ---- SSH server (so accounts can also connect over SSH directly) ----
[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log

; ---- XRDP session manager + server (Ubuntu's default RDP stack) ----
[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/xrdp-sesman.log
stderr_logfile=/var/log/supervisor/xrdp-sesman.log

[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/xrdp.log
stderr_logfile=/var/log/supervisor/xrdp.log

; NOTE: guacd (the RDP <-> browser proxy) runs as a separate
; `guacamole/guacd` sidecar container — see docker-compose.yml.

; ---- Web VS Code (code-server) ----
[program:code-server]
command=/opt/ubws/docker/start-code-server.sh
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/code-server.log
stderr_logfile=/var/log/supervisor/code-server.log

; ---- The dashboard web app (front door on the published port) ----
[program:dashboard]
command=/usr/bin/node /opt/ubws/src/server.js
directory=/opt/ubws
autorestart=true
priority=70
environment=NODE_ENV="production"
stdout_logfile=/var/log/supervisor/dashboard.log
stderr_logfile=/var/log/supervisor/dashboard.log
